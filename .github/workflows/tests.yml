name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-unit:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run default test suite
        run: python -W always::ResourceWarning -m unittest discover -s tests -v
      - name: Run bridge state tests
        run: python -m unittest -v test_bridge
